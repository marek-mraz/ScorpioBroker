name: Build and run ETSI Test and publish 

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      no_reset:
        description: "Diagnostic: never erase DBs between suites (pollution persists; expect cross-suite false failures + by-design temporal accumulation; publish gate will likely block)"
        type: boolean
        default: false

jobs:
  build-and-test-serial:
    name: Build & Run ETSI Tests (5-broker stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publish the ETSI-green image to GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch the ETSI test suite
        run: git clone --depth 1 https://github.com/marek-mraz/ngsi-ld-test-suite.git ngsi-ld-test-suite

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Map host.docker.internal to the runner host
        run: |
          BRIDGE_IP=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "$BRIDGE_IP host.docker.internal" | sudo tee -a /etc/hosts

      - name: Set up Python for the suite
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq python3-virtualenv

      - name: Run the ETSI serial suite against the 5-broker stack
        env:
          # CI reachability: the runner reaches the brokers on their published ports, and the brokers
          # reach the suite's notification/context mock servers (on the runner) via host.docker.internal.
          B1: http://host.docker.internal:9081/ngsi-ld/v1
          B2: http://host.docker.internal:9082/ngsi-ld/v1
          B3: http://host.docker.internal:9083/ngsi-ld/v1
          B4: http://host.docker.internal:9084/ngsi-ld/v1
          B5: http://host.docker.internal:9085/ngsi-ld/v1
          CALLBACK_HOST: host.docker.internal
          NO_RESET: ${{ inputs.no_reset && '1' || '' }}
        run: |
          # Brings up compose-files/docker-compose-iop.yml (build from source) and runs every suite
          # serially — exactly what `dev/etsi-serial.sh` does locally, so results match.
          ./dev/etsi-serial.sh || true

      - name: Publish run summary + failure report to the job summary
        if: always()
        run: |
          # FRONT PAGE first: run-summary.md = errors/passing line, memory+CPU short summary,
          # ETSI suite table, memory table, CPU table (written by etsi-serial.sh).
          cat ngsi-ld-test-suite/results/run-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -s ngsi-ld-test-suite/etsi-failures.md ]; then
            # Then the failures-only detail report (per-test expected vs actual).
            cat ngsi-ld-test-suite/etsi-failures.md >> "$GITHUB_STEP_SUMMARY"
            # DB pollution report: leftover rows captured BEFORE each between-suite erase, so
            # polluted state is visible in CI instead of being silently truncated away.
            cat ngsi-ld-test-suite/results/pollution-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          else
            echo "No etsi-failures.md produced — the suite likely did not run; check the logs." >> "$GITHUB_STEP_SUMMARY"
            docker compose -p iop -f compose-files/docker-compose-iop.yml logs --tail 80 || true
          fi

      - name: Gate — verify the run is 100% green AND within the memory limit
        id: gate
        run: |
          python3 - <<'EOF'
          import os, sys, xml.etree.ElementTree as ET
          expected = ["CommonBehaviours", "ContextInformation-Consumption",
                      "ContextInformation-Provision", "ContextInformation-Subscription",
                      "ContextSource", "jsonldContext", "DistributedOperations", "IOP"]
          problems, total = [], 0
          for name in expected:
              path = f"ngsi-ld-test-suite/results/{name}/output.xml"
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  problems.append(f"{name}: no readable output.xml ({e})"); continue
              stat = root.find("./statistics/total/stat")
              p, f, s = (int(stat.get(k, "0")) for k in ("pass", "fail", "skip"))
              errs = len(root.findall("./errors/msg[@level='ERROR']"))
              for cond, msg in [(f, f"{f} FAILED"), (s, f"{s} SKIPPED"),
                                (errs, f"{errs} robot execution ERROR(s)"),
                                (p == 0, "0 tests passed — suite did not run")]:
                  if cond: problems.append(f"{name}: {msg}")
              total += p
          # Memory gate: etsi-serial.sh writes PASS/FAIL after comparing every scorpio broker's
          # peak RSS against MEM_LIMIT_MB (default 350 MiB). FAIL fails this step (and the job) —
          # the summary + artifact steps run regardless (if: always()), so the report survives.
          try:
              memgate = open("ngsi-ld-test-suite/results/gate-status.txt").read().strip()
          except OSError:
              memgate = "MISSING"
          if memgate != "PASS":
              problems.append(f"memory gate: {memgate} — a scorpio broker exceeded the RSS limit "
                              "(see run-summary.md above)")
          green = not problems
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"green={str(green).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if green:
                  out.write(f"\n## Publish gate: GREEN — {total} tests passed, 0 failed, "
                            f"all {len(expected)} suites ran, memory within limit. "
                            f"Image will be published.\n")
              else:
                  out.write("\n## Publish gate: NOT green — image NOT published\n")
                  out.writelines(f"- {p}\n" for p in problems)
          print(("ALL GREEN" if green else "NOT GREEN"), *problems, sep="\n")
          # Only the MEMORY gate fails the job (per request): report is published either way.
          sys.exit(1 if memgate != "PASS" else 0)
          EOF

      - name: Publish the ETSI-green image to GHCR
        if: steps.gate.outputs.green == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/scorpio-broker
          # Push the EXACT image the suite just tested (built from this checkout by run-iop.sh).
          docker tag scorpio-local:latest "$IMG:${GITHUB_SHA::7}"
          docker tag scorpio-local:latest "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest"
          echo -e "\n## Published: \`$IMG:${GITHUB_SHA::7}\` + \`$IMG:latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tear the stack down
        if: always()
        run: ./dev/run-iop.sh down || true

      - name: Upload ETSI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETSI-Serial-Reports
          path: |
            ngsi-ld-test-suite/results/
            ngsi-ld-test-suite/etsi-failures.md
          retention-days: 14
