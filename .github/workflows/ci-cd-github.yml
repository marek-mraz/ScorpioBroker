name: CI/CD Pipeline - Build, Test, and Push to GHCR

on:
  push:
    branches:
      - main
      - 'development-quarkus'
  pull_request:
  workflow_dispatch:

# Add necessary permissions for GitHub Actions to push to the GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: all-in-one-runner
  PROFILE: kafka

jobs:
  # ==========================================
  # 1. BUILD JOB: Compiles code & builds image ONCE
  # ==========================================
  build:
    name: Build Java & Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Application and Docker Image
        run: |
          mvn clean package -DskipTests -P${{ env.PROFILE }} -D${{ env.PROFILE }} \
            -Ddocker \
            -Dquarkus.profile=${{ env.PROFILE }} \
            -Ddocker-tag=${{ github.sha }}

      - name: Save Docker Image to Tarball
        # Saves the local image so we can pass it to all parallel testing jobs
        run: |
          docker save scorpiobroker/${{ env.IMAGE_NAME }}:${{ github.sha }} -o scorpio-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorpio-image-artifact
          path: scorpio-image.tar
          retention-days: 1

  # ==========================================
  # 2A. TEST API JOB: Runs Postman/Newman Tests
  # ==========================================
  test-api:
    name: Run API Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-image-artifact

      - name: Load Pre-built Docker Image
        run: |
          docker load -i scorpio-image.tar
          docker tag scorpiobroker/${{ env.IMAGE_NAME }}:${{ github.sha }} scorpiobroker/${{ env.IMAGE_NAME }}:java-${{ env.PROFILE }}-latest

      - name: Build Test dependencies
        run: |
          cd testserver && docker build -t testserver .

      - name: Start Environment (Docker Compose)
        run: |
          docker compose -f ./compose-files/docker-compose-java-aaio-${{ env.PROFILE }}-test.yml up > dockerout.log 2>&1 &
          echo "Waiting 120 seconds for Scorpio and Dependencies to initialize..."
          sleep 120

      - name: Run Newman API Tests
        run: |
          npm install -g newman
          mkdir -p test-reports
          newman run api-test.json -e api-test-aaio-environment.json \
            --reporters cli,json,html \
            --reporter-json-export test-reports/newman-report.json \
            --reporter-html-export test-reports/newman-report.html | tee newman-console.log

      - name: Extract API Errors
        if: always()
        run: |
          echo "=== API Test Errors ===" > test-reports/api-errors-summary.txt
          grep -A 5 -B 2 "AssertionError" newman-console.log >> test-reports/api-errors-summary.txt || echo "No explicit assertion errors found." >> test-reports/api-errors-summary.txt
          grep "✗" newman-console.log >> test-reports/api-errors-summary.txt || true

      - name: Stop Environment
        if: always()
        run: docker compose -f ./compose-files/docker-compose-java-aaio-${{ env.PROFILE }}-test.yml down

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Reports
          path: test-reports/
          retention-days: 1

  # ==========================================
  # 2B. TEST ETSI JOB: Runs in PARALLEL via Matrix
  # ==========================================
  test-etsi:
    name: ETSI - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CommonBehaviours
            path: CommonBehaviours
          - name: Consumption-Discovery
            path: ContextInformation/Consumption/Discovery
          - name: Consumption-Entity
            path: ContextInformation/Consumption/Entity
          - name: Consumption-TemporalEntity
            path: ContextInformation/Consumption/TemporalEntity
          - name: Provision-BatchEntities
            path: ContextInformation/Provision/BatchEntities
          - name: Provision-Entities
            path: ContextInformation/Provision/Entities
          - name: Provision-EntityAttributes
            path: ContextInformation/Provision/EntityAttributes
          - name: Provision-TemporalEntity
            path: ContextInformation/Provision/TemporalEntity
          - name: Provision-TemporalEntityAttributes
            path: ContextInformation/Provision/TemporalEntityAttributes
          - name: Subscription
            path: ContextInformation/Subscription
          - name: ContextSource
            path: ContextSource
          - name: DistributedOperations
            path: DistributedOperations
          - name: jsonldContext
            path: jsonldContext
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-image-artifact

      - name: Load Pre-built Docker Image
        run: |
          docker load -i scorpio-image.tar
          docker tag scorpiobroker/${{ env.IMAGE_NAME }}:${{ github.sha }} scorpiobroker/${{ env.IMAGE_NAME }}:java-${{ env.PROFILE }}-latest

      - name: Build Test dependencies
        run: |
          cd testserver && docker build -t testserver .

      - name: Start Environment (Docker Compose)
        run: |
          docker compose -f ./compose-files/docker-compose-java-aaio-${{ env.PROFILE }}-test.yml up > dockerout.log 2>&1 &
          echo "Waiting 120 seconds for Scorpio to initialize..."
          sleep 120

      - name: Get ETSI Testsuite
        run: git clone https://forge.etsi.org/rep/cim/ngsi-ld-test-suite.git

      - name: Check out specific testsuite branch for jsonldContext
        if: matrix.name == 'jsonldContext'
        run: |
          cd ngsi-ld-test-suite
          git checkout fix/jsonldContext || true

      - name: Config ETSI Testsuite
        run: |
          cd ngsi-ld-test-suite/resources/
          cat <<EOF > variables.py.new
          url = 'http://localhost:9090/ngsi-ld/v1'
          temporal_api_url = 'http://localhost:9090/ngsi-ld/v1'
          ngsild_test_suite_context = 'https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld'
          notification_server_host = 'host.docker.internal'
          notification_server_port = 8085
          context_source_host = 'host.docker.internal'
          context_source_port = 8086
          context_server_host = 'host.docker.internal'
          context_server_port = 8087
          EOF
          tail -n +11 variables.py >> variables.py.new
          mv variables.py.new variables.py

      - name: Start ETSI Testsuite
        run: |
          cd ngsi-ld-test-suite
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq python3-virtualenv
          virtualenv .venv 
          source .venv/bin/activate
          pip install -r requirements.txt
          
          robot --exclude mqtt --exclude iop --outputdir ./results ./TP/NGSI-LD/${{ matrix.path }} || true

      - name: Extract ETSI Errors
        if: always()
        run: |
          mkdir -p etsi-reports
          cp -r ngsi-ld-test-suite/results/* etsi-reports/ || true
          echo "=== ETSI Failed Tests Summary (${{ matrix.name }}) ===" > etsi-reports/etsi-errors-summary.txt
          grep "FAIL" etsi-reports/output.xml | sed -e 's/<[^>]*>//g' >> etsi-reports/etsi-errors-summary.txt || echo "No FAIL flags found in XML." >> etsi-reports/etsi-errors-summary.txt

      - name: Stop Environment
        if: always()
        run: docker compose -f ./compose-files/docker-compose-java-aaio-${{ env.PROFILE }}-test.yml down

      - name: Upload ETSI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETSI-Reports-${{ matrix.name }}
          path: etsi-reports/
          retention-days: 1
          
  # ==========================================
  # 2C. TEST IOP JOB: Runs ETSI Interoperability Tests
  # ==========================================
  test-iop:
    name: Run IOP Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-image-artifact

      - name: Load Pre-built Docker Image
        run: |
          docker load -i scorpio-image.tar
          docker tag scorpiobroker/${{ env.IMAGE_NAME }}:${{ github.sha }} scorpiobroker/${{ env.IMAGE_NAME }}:java-latest

      - name: Start IOP Environment (5 Brokers)
        run: |
          docker compose -f ./compose-files/docker-compose-iop-test.yml up > dockerout.log 2>&1 &
          echo "Waiting 120 seconds for all 5 Scorpio brokers to initialize..."
          sleep 120

      - name: Get ETSI Testsuite
        run: git clone https://forge.etsi.org/rep/cim/ngsi-ld-test-suite.git

      - name: Run ETSI IOP Tests
        run: |
          cd ngsi-ld-test-suite
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq python3-virtualenv
          virtualenv .venv 
          source .venv/bin/activate
          pip install -r requirements.txt
          
          robot \
            --variable url:http://localhost:9081/ngsi-ld/v1 \
            --variable temporal_api_url:http://localhost:9081/ngsi-ld/v1 \
            --variable b1_url:http://localhost:9081/ngsi-ld/v1 \
            --variable b2_url:http://localhost:9082/ngsi-ld/v1 \
            --variable b3_url:http://localhost:9083/ngsi-ld/v1 \
            --variable b4_url:http://localhost:9084/ngsi-ld/v1 \
            --variable b5_url:http://localhost:9085/ngsi-ld/v1 \
            --outputdir ./results-iop \
            ./IOP_TP || true

      - name: Stop IOP Environment
        if: always()
        run: docker compose -f ./compose-files/docker-compose-iop-test.yml down

      - name: Upload IOP Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IOP-Reports
          path: ngsi-ld-test-suite/results-iop/
          retention-days: 1

  # ==========================================
  # 3. MERGE REPORTS: Group everything into 1 ZIP
  # ==========================================
  merge-test-reports:
    name: Group All Test Artifacts
    needs: [test-api, test-etsi, test-iop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all separated test reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Reports*'
          path: combined-test-reports
          merge-multiple: false # Keeps the folders separated inside the master directory

      - name: Upload Master Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorpio-Master-Test-Reports
          path: combined-test-reports/
          retention-days: 14

  # ==========================================
  # 4. PUBLISH JOB: Pushes to GitHub Packages
  # ==========================================
  publish:
    name: Push Image to GitHub Registry
    needs: [test-api, test-etsi, test-iop] # Enforces that ALL tests must pass successfully
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-image-artifact

      - name: Load Pre-built Docker Image
        run: docker load -i scorpio-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image to GHCR
        run: |
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          LOCAL_IMAGE="scorpiobroker/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          GHCR_IMAGE_LATEST="${{ env.REGISTRY }}/$OWNER_LOWERCASE/${{ env.IMAGE_NAME }}:java-${{ env.PROFILE }}"
          GHCR_IMAGE_SHA="${{ env.REGISTRY }}/$OWNER_LOWERCASE/${{ env.IMAGE_NAME }}:java-${{ env.PROFILE }}-${{ github.sha }}"

          echo "Pushing $GHCR_IMAGE_LATEST..."
          docker tag $LOCAL_IMAGE $GHCR_IMAGE_LATEST
          docker push $GHCR_IMAGE_LATEST

          echo "Pushing $GHCR_IMAGE_SHA..."
          docker tag $LOCAL_IMAGE $GHCR_IMAGE_SHA
          docker push $GHCR_IMAGE_SHA