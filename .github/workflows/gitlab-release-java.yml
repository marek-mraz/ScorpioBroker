name: Release Java Multi-Arch to GitLab Registry

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags (e.g., v6.0.1)
  workflow_dispatch: # Allow manual triggers from the GitHub UI
    inputs:
      version:
        description: 'Release Version (e.g. 6.0.1)'
        required: true
        default: '6.0.1'

env:
  GITLAB_REGISTRY: registry.gitlab.com
  # CHANGE THIS to your actual GitLab namespace/project path
  GITLAB_NAMESPACE: registry.gitlab.com/your-group/scorpiobroker

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Currently ONLY building kafka. Uncomment others when needed in the future.
        profile: [kafka] 
        # Future: profile: [kafka, sqs, amqp, mqtt, in-memory]
        arch: [amd64, arm64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GITLAB_REGISTRY }}
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            # Strips 'refs/tags/v' to get just '6.0.1'
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION_TAG" >> $GITHUB_ENV
          fi

      - name: Update POM Versions
        run: |
          find . -name "pom.xml" -exec sed -i "s/${{ env.VERSION }}-SNAPSHOT/${{ env.VERSION }}/g" {} +

      - name: Build Testserver
        run: |
          cd testserver
          docker build -t testserver .

      - name: Build Java Image
        run: |
          # Build Java Docker Image (No -Dnative)
          if [ "${{ matrix.profile }}" == "in-memory" ]; then
            PROFILE_FLAG="-Din-memory -Pin-memory"
          else
            PROFILE_FLAG="-D${{ matrix.profile }} -P${{ matrix.profile }}"
          fi

          # The tag built locally includes the architecture so we can test it before pushing
          mvn clean package -DskipTests $PROFILE_FLAG \
            -Ddocker \
            -Dquarkus.profile=${{ matrix.profile }} \
            -Dquarkus.docker.buildx.platform=linux/${{ matrix.arch }} \
            -Ddocker-tag=java-${{ matrix.profile }}-${{ env.VERSION }}-${{ matrix.arch }}

      - name: Start Docker Compose Environment
        run: |
          # Re-tag temporarily to 'latest' so the existing compose files work without modification
          docker tag scorpiobroker/all-in-one-runner:java-${{ matrix.profile }}-${{ env.VERSION }}-${{ matrix.arch }} scorpiobroker/all-in-one-runner:java-${{ matrix.profile }}-latest
          
          if [ "${{ matrix.profile }}" == "in-memory" ]; then
            COMPOSE_FILE="./compose-files/docker-compose-java-aaio-test.yml"
          else
            COMPOSE_FILE="./compose-files/docker-compose-java-aaio-${{ matrix.profile }}-test.yml"
          fi
          
          echo "Starting environment using $COMPOSE_FILE"
          docker compose -f $COMPOSE_FILE up -d
          
          # Wait for broker and Scorpio to initialize
          sleep 120 

      - name: Run Newman API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: api-test.json
          environment: api-test-aaio-environment.json
          reporters: '["cli"]'

      - name: Stop Docker Compose Environment
        if: always()
        run: |
          if [ "${{ matrix.profile }}" == "in-memory" ]; then
            COMPOSE_FILE="./compose-files/docker-compose-java-aaio-test.yml"
          else
            COMPOSE_FILE="./compose-files/docker-compose-java-aaio-${{ matrix.profile }}-test.yml"
          fi
          docker compose -f $COMPOSE_FILE down

      - name: Tag and Push Arch-Specific Images to GitLab (On Success Only)
        run: |
          # Only selecting all-in-one-runner for now. 
          # Future components to add back: at-context-server history-entity-manager history-query-manager registry-subscription-manager registry-manager subscription-manager query-manager entity-manager
          
          COMPONENTS="all-in-one-runner"

          for comp in $COMPONENTS; do
            # Local tag generated by Maven
            LOCAL_IMAGE="scorpiobroker/$comp:java-${{ matrix.profile }}-${{ env.VERSION }}-${{ matrix.arch }}"
            
            # Destination tag in GitLab with architecture suffix
            GITLAB_IMAGE="${{ env.GITLAB_NAMESPACE }}/$comp:java-${{ matrix.profile }}-${{ env.VERSION }}-${{ matrix.arch }}"

            echo "Pushing $GITLAB_IMAGE..."
            docker tag $LOCAL_IMAGE $GITLAB_IMAGE
            docker push $GITLAB_IMAGE
          done

  # This job runs ONLY after BOTH amd64 and arm64 tests pass successfully
  create-multiarch-manifests:
    needs: build-test-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Currently ONLY doing kafka.
        profile: [kafka]
        # Future: profile: [kafka, sqs, amqp, mqtt, in-memory]
    steps:
      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GITLAB_REGISTRY }}
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION_TAG" >> $GITHUB_ENV
          fi

      - name: Create and Push Multi-arch Manifests
        run: |
          # Only selecting all-in-one-runner for now.
          # Future components to add back: at-context-server history-entity-manager history-query-manager registry-subscription-manager registry-manager subscription-manager query-manager entity-manager
          
          COMPONENTS="all-in-one-runner"

          for comp in $COMPONENTS; do
            IMAGE_BASE="${{ env.GITLAB_NAMESPACE }}/$comp"
            
            # The images we pushed in the previous job
            AMD_IMAGE="$IMAGE_BASE:java-${{ matrix.profile }}-${{ env.VERSION }}-amd64"
            ARM_IMAGE="$IMAGE_BASE:java-${{ matrix.profile }}-${{ env.VERSION }}-arm64"
            
            # The final unified tags (e.g. java-kafka-6.0.1)
            MANIFEST_TAG="$IMAGE_BASE:java-${{ matrix.profile }}-${{ env.VERSION }}"
            LATEST_TAG="$IMAGE_BASE:java-${{ matrix.profile }}-latest"

            echo "Creating manifest for $MANIFEST_TAG..."
            docker manifest create $MANIFEST_TAG $AMD_IMAGE $ARM_IMAGE
            docker manifest push $MANIFEST_TAG

            echo "Creating manifest for $LATEST_TAG..."
            docker manifest create $LATEST_TAG $AMD_IMAGE $ARM_IMAGE
            docker manifest push $LATEST_TAG
          done