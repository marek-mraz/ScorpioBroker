# IOP (interoperability) test env — IN-MEMORY messaging variant: 5 independent
# Scorpio brokers, each with its own postgres. NO Kafka.
#
# Why in-memory for IOP/ETSI: with the in-memory profile, intra-broker module
# messaging (e.g. a new ContextSourceRegistration reaching the QueryManager's
# federation-routing cache) is dispatched SYNCHRONOUSLY in the same request flow
# (MicroServiceUtils.serializeAndSplitObjectAndEmit -> sendObjectInMemory). So a
# query issued immediately after `POST /csourceRegistrations` returns 201 already
# sees the registration (read-your-writes). The Kafka profile defers that to an
# async consumer, leaving a few-second window where a just-created registration is
# invisible to federated queries — which the ETSI IOP tests (no retry/wait) fail on.
# Federation BETWEEN brokers is over HTTP, so dropping Kafka does not affect it.
#
# Build the in-memory image first, then bring this up:
#   dev/build-image.sh in-memory scorpio-local:inmem
#   docker compose -f compose-files/docker-compose-iop-test-inmemory.yml up -d
services:
  # ========================================== BROKER 1
  postgres1:
    image: postgis/postgis:14-3.3
    environment: { POSTGRES_USER: ngb, POSTGRES_PASSWORD: ngb, POSTGRES_DB: ngb }
    mem_limit: 256m
  scorpio1:
    image: scorpio-local:inmem
    build:
      context: ../AllInOneRunner
      dockerfile: src/main/docker/Dockerfile.jvm
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: { DBHOST: postgres1, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio1:9090" }
    ports: ["9081:9090"]
    depends_on: [postgres1]

