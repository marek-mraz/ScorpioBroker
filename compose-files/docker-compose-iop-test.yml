# ============================================================================
# SINGLE federation test stack for BOTH the ETSI IOP suite (IOP_TP) and the ETSI
# DistributedOperations suite (TP/NGSI-LD/DistributedOperations).
#
# 5 independent Scorpio brokers, each fully self-contained: its own Postgres,
# IN-MEMORY messaging (NO Kafka). One compose file, no override needed.
#
# Images are ALWAYS BUILT FROM THE LOCAL REPOSITORY (the `build:` block below),
# so the stack always exercises the current working tree (incl. local fixes).
# Dockerfile.jvm only COPYs AllInOneRunner/target/quarkus-app, so the jar must be
# packaged (in-memory profile) before the docker build. One command does both:
#   dev/run-iop.sh                 # mvn package (in-memory) + compose up --build + health
# or manually:
#   mvn -q -DskipTests -Din-memory -Pin-memory -Dquarkus.profile=in-memory clean install
#   docker compose -p iop -f compose-files/docker-compose-iop-test.yml up -d --build
#
# Why in-memory (NOT kafka):
#   * Read-your-writes: a query issued right after `POST /csourceRegistrations`
#     already sees the registration (the ETSI IOP/DistributedOperations tests do
#     not retry/wait). The Kafka profile defers the QueryManager's federation cache
#     update to an async consumer, so just-created registrations are invisible.
#   * Lighter: no Kafka, fits this ~6 GB docker-out-of-docker box.
#   * Federation BETWEEN brokers is plain HTTP, so dropping Kafka does not affect it.
#
# Reachability:
#   * From this dev container (where the Robot suite runs): by service hostname,
#     http://scorpio1:9090 .. http://scorpio5:9090 (published 9081-9085 land on the
#     VM host, NOT this container's localhost — docker-out-of-docker).
#   * Between brokers (federation endpoints stored in a registration) and from a CI
#     runner: http://host.docker.internal:9081 .. :9085 (extra_hosts maps
#     host.docker.internal to the host gateway inside every container; a CI runner
#     aliases it to 127.0.0.1). Use host.docker.internal in bN_url so the SAME url
#     works as both the client endpoint and the stored federation endpoint.
# ============================================================================

x-postgres: &pg
  image: imresamu/postgis:16-3.5      # multi-arch (official postgis/postgis is amd64-only)
  environment: { POSTGRES_USER: ngb, POSTGRES_PASSWORD: ngb, POSTGRES_DB: ngb }
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ngb"]
    interval: 5s
    timeout: 3s
    retries: 20
  mem_limit: 256m

x-scorpio: &scorpio
  image: scorpio-local:inmem
  build:
    context: ../AllInOneRunner
    dockerfile: src/main/docker/Dockerfile.jvm
  command: ["java", "-Xmx512m", "--enable-native-access=ALL-UNNAMED", "-jar", "quarkus-run.jar"]
  mem_limit: 900m
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  postgres1: { <<: *pg }
  scorpio1:
    <<: *scorpio
    environment: { DBHOST: postgres1, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio1:9090" }
    ports: ["9081:9090"]
    depends_on: { postgres1: { condition: service_healthy } }

  postgres2: { <<: *pg }
  scorpio2:
    <<: *scorpio
    environment: { DBHOST: postgres2, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio2:9090" }
    ports: ["9082:9090"]
    depends_on: { postgres2: { condition: service_healthy } }

  postgres3: { <<: *pg }
  scorpio3:
    <<: *scorpio
    environment: { DBHOST: postgres3, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio3:9090" }
    ports: ["9083:9090"]
    depends_on: { postgres3: { condition: service_healthy } }

  postgres4: { <<: *pg }
  scorpio4:
    <<: *scorpio
    environment: { DBHOST: postgres4, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio4:9090" }
    ports: ["9084:9090"]
    depends_on: { postgres4: { condition: service_healthy } }

  postgres5: { <<: *pg }
  scorpio5:
    <<: *scorpio
    environment: { DBHOST: postgres5, SCORPIO_STARTUPDELAY: 5s, GATEWAY: "http://scorpio5:9090" }
    ports: ["9085:9090"]
    depends_on: { postgres5: { condition: service_healthy } }

# Join the network this dev container is already attached to (dev/start-deps.sh creates it), so the
# Robot suite running HERE can reach the brokers by hostname (http://scorpio1:9090 ..). The brokers
# also resolve each other by these hostnames for federation. external = must already exist.
networks:
  default:
    name: compose-files_default
    external: true
