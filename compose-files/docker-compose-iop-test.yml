version: '3'

services:
  # Broker 1
  postgres1:
    image: postgis/postgis
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  scorpio1:
    image: scorpiobroker/all-in-one-runner:java-latest
    environment:
      DBHOST: postgres1
    ports:
      - "9081:9090"
    depends_on:
      - postgres1

  # Broker 2
  postgres2:
    image: postgis/postgis
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  scorpio2:
