# IOP (interoperability) test env: 5 independent Scorpio brokers, each with its
# own postgres + single-node kafka. Kafka services mirror the known-good
# docker-compose-java-aaio-kafka-test.yml: apache/kafka uses KAFKA_* env vars
# (NOT KAFKA_CFG_*, which is the Bitnami prefix the apache image ignores) and
# must advertise its own container hostname. Scorpio reads BUSHOST/DBHOST.
#
# The Scorpio brokers are BUILT FROM SOURCE (image scorpio-local:dev, via
# AllInOneRunner/src/main/docker/Dockerfile.jvm) — NOT the published java-latest
# image — so IOP always exercises the current working tree. The Dockerfile only
# COPYs target/quarkus-app, so build the jar first (kafka profile), then bring the
# stack up; `docker compose build` reuses the single scorpio-local:dev image for
# all five brokers. One-liner:
#   dev/build-image.sh kafka scorpio-local:dev   # mvn clean install + docker build
#   docker compose -f compose-files/docker-compose-iop-test.yml \
#                  -f compose-files/docker-compose-iop-test.override.yml up -d
# (Building v1.8/v1.9 core-context support from source is what lets the brokers
#  resolve the ETSI test-suite @context locally instead of fetching uri.etsi.org,
#  which is 403-blocked from inside the containers and otherwise fails compaction.)
services:
  # ========================================== BROKER 1
  postgres1:
    image: postgis/postgis:14-3.3
    environment: { POSTGRES_USER: ngb, POSTGRES_PASSWORD: ngb, POSTGRES_DB: ngb }
  kafka1:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_RETENTION_MS: 10000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  scorpio1:
    image: scorpio-local:dev
    build:
      context: ../AllInOneRunner
      dockerfile: src/main/docker/Dockerfile.jvm
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: { DBHOST: postgres1, BUSHOST: kafka1, SCORPIO_STARTUPDELAY: 15s, GATEWAY: "http://scorpio1:9090" }
    ports: ["9081:9090"]
    depends_on: [postgres1, kafka1]

