# Memory caps for the IOP stack so it fits this ~6 GB docker-out-of-docker box.
# Scorpio CMD is a bare `java -jar` (no heap env), so override the command to cap heap;
# kafka takes KAFKA_HEAP_OPTS. mem_limit guards against RSS spikes.
services:
  scorpio1:
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
  scorpio2:
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
  scorpio3:
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
  scorpio4:
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
  scorpio5:
    command: ["java","-Xmx512m","--enable-native-access=ALL-UNNAMED","-jar","quarkus-run.jar"]
    mem_limit: 900m
  kafka1:
    environment: { KAFKA_HEAP_OPTS: "-Xmx300m -Xms300m" }
    mem_limit: 480m
  kafka2:
    environment: { KAFKA_HEAP_OPTS: "-Xmx300m -Xms300m" }
    mem_limit: 480m
  kafka3:
    environment: { KAFKA_HEAP_OPTS: "-Xmx300m -Xms300m" }
    mem_limit: 480m
  kafka4:
    environment: { KAFKA_HEAP_OPTS: "-Xmx300m -Xms300m" }
    mem_limit: 480m
  kafka5:
    environment: { KAFKA_HEAP_OPTS: "-Xmx300m -Xms300m" }
    mem_limit: 480m
