# Full all-in-one test stack: Postgres + Kafka + Scorpio AAIO + notification receiver.
# Used to run the api-test.json Postman/newman suite end-to-end.
#
#   IMAGE_TAG=java-kafka-7.0.0 docker compose -f compose-files/docker-compose-aaio-test.yml up -d
#
# Then run the tests (newman) against http://localhost:9090 with the notification
# receiver on http://localhost:8080 (see docs/BUILD_AND_TEST.md).
services:
  postgres:
    image: imresamu/postgis:16-3.5      # multi-arch (official postgis is amd64-only)
    container_name: scorpio-test-postgres
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngb"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    container_name: scorpio-test-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  scorpio:
    image: scorpiobroker/all-in-one-runner:${IMAGE_TAG:-java-kafka-7.0.0}
    container_name: scorpio-test-aaio
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_PROFILE: kafka
    ports:
      - "9090:9090"

  # Notification receiver expected by the subscription tests (api-test.json -> notificationserver).
  # Source: testserver/testserver.py. Stores notifications by subscriptionId (POST) and
  # serves them back on GET /<subId>; GET /deleteAll clears.
  notificationserver:
    image: python:3
    container_name: scorpio-test-notify
    working_dir: /app
    volumes:
      - ../testserver:/app:ro
    command: python testserver.py 8080
    ports:
      - "8080:8080"
