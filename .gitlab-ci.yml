# =============================================================================
# Scorpio NGSI-LD Broker - GitLab CI/CD
#
# Builds the All-In-One-Runner "java-kafka" Docker image and runs the full
# api-test.json (Postman/newman) suite against it.
#
# Produces:  scorpiobroker/all-in-one-runner:java-kafka-${IMAGE_VERSION}
#
# See docs/BUILD_AND_TEST.md for the full manual (local + CI).
# =============================================================================

stages:
  - build
  - image
  - test

variables:
  # Image coordinates. IMAGE_VERSION drives the "java-kafka-<version>" tag.
  IMAGE_VERSION: "7.0.0"
  IMAGE_NAME: "scorpiobroker/all-in-one-runner"
  IMAGE_TAG: "java-kafka-${IMAGE_VERSION}"
  # Messaging flavour: maven profile (-Dkafka) + quarkus runtime profile.
  MAVEN_CLI_OPTS: "-B -ntp -Dmaven.test.skip=true"
  MAVEN_OPTS: "-Xmx1500m -Dmaven.repo.local=.m2/repository"
  # docker:dind
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

# Cache the local maven repo between jobs/pipelines to keep builds fast.
cache:
  key: "scorpio-m2"
  paths:
    - .m2/repository

# -----------------------------------------------------------------------------
# 1) Compile + install the whole reactor (so the AAIO module resolves siblings).
# -----------------------------------------------------------------------------
build:
  stage: build
  image: eclipse-temurin:21-jdk
  before_script:
    - ./mvnw --version || mvn --version
  script:
    - mvn $MAVEN_CLI_OPTS clean install
  artifacts:
    # Reuse the compiled output in the image stage instead of recompiling.
    paths:
      - "**/target/quarkus-app/"
      - "**/target/*.jar"
    expire_in: 1 day

# -----------------------------------------------------------------------------
# 2) Build the java-kafka AAIO image and push it.
#    Quarkus container-image-docker builds from AllInOneRunner/.../Dockerfile.jvm
#    via the docker daemon (dind), tagging scorpiobroker/all-in-one-runner:<tag>.
# -----------------------------------------------------------------------------
image:
  stage: image
  image: eclipse-temurin:21-jdk
  services:
    - docker:27-dind
  before_script:
    # docker CLI inside the JDK image
    - apt-get update -qq && apt-get install -y -qq docker.io
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
  script:
    # -Dkafka              -> pull in the kafka connector (maven profile)
    # -Dquarkus.profile=kafka -> bake kafka (de)serializers at build time
    # -Ddocker             -> activate the AAIO container-image profile
    # -Ddocker-tag=...     -> sets quarkus.container-image.tag
    - >
      mvn $MAVEN_CLI_OPTS package
      -Dkafka -Dquarkus.profile=kafka
      -Ddocker -Ddocker-tag=${IMAGE_TAG}
      -Dquarkus.container-image.push=true
    - docker image ls "${IMAGE_NAME}"
  rules:
    # Push only from the default branch / tags; build-only on MRs.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# 3) Run the api-test.json suite against the freshly built image.
#    Brings up postgres + kafka + the AAIO image + the notification receiver,
#    then runs newman. Fails the pipeline on assertion failures.
# -----------------------------------------------------------------------------
api-test:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    FF_NETWORK_PER_BUILD: "true"   # let service containers resolve each other
  before_script:
    - apk add --no-cache docker-cli-compose nodejs npm
    - npm install -g newman
    - until docker info >/dev/null 2>&1; do sleep 1; done
  script:
    - export IMAGE_TAG=${IMAGE_TAG}
    - docker compose -f compose-files/docker-compose-aaio-test.yml up -d
    # wait for the broker to answer
    - |
      for i in $(seq 1 60); do
        if docker run --rm --network "${CI_PROJECT_NAME}_default" curlimages/curl -sf http://scorpio:9090/q/health/ready; then break; fi
        sleep 5
      done
    - >
      newman run api-test.json
      -e api-test-newman-env.json
      --reporters cli,junit
      --reporter-junit-export newman-report.xml
  after_script:
    - docker compose -f compose-files/docker-compose-aaio-test.yml logs scorpio > scorpio.log || true
    - docker compose -f compose-files/docker-compose-aaio-test.yml down -v || true
  artifacts:
    when: always
    paths:
      - scorpio.log
    reports:
      junit: newman-report.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
